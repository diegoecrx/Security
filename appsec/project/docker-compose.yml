# Local runtime for SecureBank. Reproducible on any machine with a container engine.
# Pin image tags for cross-machine consistency.
services:
  api:
    build: ./application/backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    # NOTE: this app is intentionally vulnerable. Local use only.

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - redisdata:/data

  # Frontend is optional early; uncomment when built.
  # web:
  #   build: ./application/frontend
  #   ports: ["3000:3000"]
  #   depends_on: [api]

volumes:
  pgdata:
  redisdata:
